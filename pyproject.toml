[project]
name = "doctor-rounds"
version = "0.1.0"
description = "Doctor Rounds — a clinical-focused RAG evaluation framework. Makes rounds on your RAG pipeline's outputs, checking their vitals (faithfulness, retrieval quality) and flagging symptoms (hallucinations, retrieval failures)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Het Parekh" }]
keywords = ["rag", "evaluation", "llm", "hallucination-detection", "clinical-nlp", "retrieval"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic>=2.6",
  "numpy>=1.26",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
chroma = ["chromadb>=0.5"]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.30"]
classifier = ["torch>=2.2", "transformers>=4.40", "datasets>=2.19", "scikit-learn>=1.4"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
doctor-rounds = "doctor_rounds.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doctor_rounds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=doctor_rounds --cov-report=term-missing"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
